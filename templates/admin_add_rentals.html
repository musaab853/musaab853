{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: 40px auto;">
    <div class="card">
        <h2 style="border: none; margin-bottom: 24px;">Create Rental Agreement</h2>
        
        <form method="POST">
            <label>Customer</label>
            <select name="customer_id" required>
                <option value="">-- Select customer --</option>
                {% for c in customers %}<option value="{{ c.customer_id }}">{{ c.name }}</option>{% endfor %}
            </select>

            <label>Solar Panel</label>
            <select name="panel_id" required>
                <option value="">-- Select panel --</option>
                {% for p in panels %}<option value="{{ p.panel_id }}">{{ p.model_name }}</option>{% endfor %}
            </select>

            <label>Start Date</label>
            <input type="date" name="start_date" required>

            <label>Monthly Rental Fee (₹)</label>
            <input type="number" step="0.01" name="monthly_rental_fee" required placeholder="e.g., 3000">

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-secondary" style="flex: 1;">Create Rental</button>
                <a href="{{ url_for('admin_rentals') }}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
