{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Inventory</h2>
    <a href="{{ url_for('admin_add_inventory') }}" class="btn">Add Item</a>
</div>
<div class="card">
    <table>
  <tr>
    <th>Panel</th><th>Stock</th><th>Supplier</th><th>Cost/Unit</th><th>Reorder Level</th><th>Action</th>
  </tr>
  {% for i in inv %}
  <tr>
    <td>{{ i.model_name }}</td>
    <td>{{ i.stock_quantity }}</td>
    <td>{{ i.supplier_info }}</td>
    <td>{{ i.cost_per_unit }}</td>
    <td>{{ i.reorder_level }}</td>
    <td>
  <a class="btn btn-sm" href="{{ url_for('admin_manage_panel', panel_id=i.panel_id) }}">
    Edit
  </a>
</td>
  </tr>
  {% endfor %}
</table>
</div>
{% endblock %}
