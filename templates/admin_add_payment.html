{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: 40px auto;">
    <div class="card">
        <h2 style="border: none; margin-bottom: 24px;">Record Payment</h2>
        
        <form method="POST">
            <label>Customer</label>
            <select name="customer_id" required>
                <option value="">-- Select customer --</option>
                {% for c in customers %}<option value="{{ c.customer_id }}">{{ c.name }}</option>{% endfor %}
            </select>

            <label>Amount (₹)</label>
            <input type="number" step="0.01" name="amount_paid" required placeholder="e.g., 5000">

            <label>Payment Method</label>
            <select name="payment_method" required>
                <option value="">-- Select method --</option>
                <option>Credit Card</option>
                <option>Cash</option>
                <option>Bank Transfer</option>
                <option>UPI</option>
            </select>

            <label>Payment Type</label>
            <select name="payment_type" required>
                <option value="">-- Select type --</option>
                <option>Rental</option>
                <option>Sale</option>
                <option>Maintenance</option>
            </select>

            <label>Status</label>
            <select name="payment_status" required>
                <option value="">-- Select status --</option>
                <option>Completed</option>
                <option>Pending</option>
            </select>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-secondary" style="flex: 1;">Record Payment</button>
                <a href="{{ url_for('admin_payments') }}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
