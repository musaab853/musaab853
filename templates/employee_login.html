{% extends "base.html" %}
{% block content %}

<div style="max-width: 400px; margin: 60px auto;">
    <div class="card">
        <h2 style="border: none; margin-bottom: 30px;">Employee Portal</h2>
        
        <form method="POST">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="your@solar.com">

            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter your password">

            <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 12px;">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <p style="margin: 0; color: var(--text-muted); font-size: 13px;">Admin & Employee Only</p>
        </div>
    </div>
</div>

{% endblock %}
