{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: 40px auto;">
    <div class="card">
        <h2 style="border: none; margin-bottom: 24px;">Schedule Maintenance</h2>
        
        <form method="POST">
            <label>Solar Panel</label>
            <select name="panel_id" required>
                <option value="">-- Select a panel --</option>
                {% for p in panels %}<option value="{{ p.panel_id }}">{{ p.model_name }}</option>{% endfor %}
            </select>

            <label>Customer (Optional)</label>
            <select name="customer_id">
                <option value="">-- None --</option>
                {% for c in customers %}<option value="{{ c.customer_id }}">{{ c.name }}</option>{% endfor %}
            </select>

            <label>Assign Technician</label>
            <select name="technician_id">
                <option value="">-- Unassigned --</option>
                {% for t in techs %}<option value="{{ t.employee_id }}">{{ t.name }}</option>{% endfor %}
            </select>

            <label>Service Date</label>
            <input type="date" name="service_date" required>

            <label>Service Type</label>
            <input type="text" name="service_type" required placeholder="e.g., Cleaning, Repair, Installation">

            <label>Service Cost (₹)</label>
            <input type="number" step="0.01" name="cost_of_service" required placeholder="e.g., 2000">

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-secondary" style="flex: 1;">Schedule Service</button>
                <a href="{{ url_for('admin_maintenance') }}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
