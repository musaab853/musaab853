{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: 40px auto;">
    <div class="card">
        <h2 style="border: none; margin-bottom: 24px;">Edit Panel – {{ panel.model_name }}</h2>

        {% if panel.image_path %}
            <div style="margin-bottom: 24px;">
                <p style="font-size: 13px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;"><strong>Current Image</strong></p>
                <img src="{{ url_for('static', filename=panel.image_path) }}"
                     alt="{{ panel.model_name }}"
                     style="max-width: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            <label>Model Name</label>
            <input type="text" name="model_name" value="{{ panel.model_name }}" required>

            <label>Panel Type</label>
            <input type="text" name="type" value="{{ panel.type }}" required>

            <label>Capacity (kW)</label>
            <input type="number" step="0.01" name="capacity_kw" value="{{ panel.capacity_kw }}" required>

            <label>Price (₹)</label>
            <input type="number" step="0.01" name="price" value="{{ panel.price }}" required>

            <label>Warranty Information</label>
            <input type="text" name="warranty_info" value="{{ panel.warranty_info or '' }}">

            <label>Status</label>
            <select name="status">
                {% for s in ['Available','Installed','Maintenance','Retired'] %}
                    <option value="{{ s }}" {% if panel.status == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>

            <label>Update Image (optional)</label>
            <input type="file" name="panel_image" accept="image/*">

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-secondary" style="flex: 1;">Save Changes</button>
                <a href="{{ url_for('admin_panels') }}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
