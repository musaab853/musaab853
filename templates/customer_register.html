{% extends "base.html" %}
{% block content %}

<div style="max-width: 500px; margin: 40px auto;">
    <div class="card">
        <h2 style="border: none; margin-bottom: 30px;">Create Your Account</h2>
        
        <form method="POST">
            <label>Full Name</label>
            <input type="text" name="name" required placeholder="John Doe">

            <label>Email Address</label>
            <input type="email" name="email" required placeholder="your@email.com">

            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="+91 98765 43210">

            <label>Address</label>
            <textarea name="address" placeholder="Your residential address" style="min-height: 100px; resize: vertical;"></textarea>

            <label>Password</label>
            <input type="password" name="password" required placeholder="Create a strong password">

            <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 12px;">Create Account</button>
        </form>

        <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <p style="margin: 0; color: var(--text-muted); font-size: 14px;">
                Already have an account? 
                <a href="{{ url_for('customer_login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
