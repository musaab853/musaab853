{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Payments</h2>
    <a href="{{ url_for('admin_add_payment') }}" class="btn">Record Payment</a>
</div>
<div class="card">
    <table>
        <tr><th>Customer</th><th>Amount</th><th>Method</th><th>Type</th><th>Status</th></tr>
        {% for p in pay %}
        <tr>
            <td>{{ p.cname }}</td>
            <td>{{ p.amount_paid }}</td>
            <td>{{ p.payment_method }}</td>
            <td>{{ p.payment_type }}</td>
            <td>{{ p.payment_status }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
